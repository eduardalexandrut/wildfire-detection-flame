name: Deploy Space

on:
  push:
    branches: [main]
    paths: ["app/**"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: pip install huggingface_hub
      - run: hf upload eduardtoni/flame-vision app . --repo-type=space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}